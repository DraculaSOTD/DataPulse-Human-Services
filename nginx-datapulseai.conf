# DataPulse Human Services - Nginx Configuration
# Domain: datapulseai.co
# Architecture: React (static) + Express API (Node.js)
#
# To install:
# sudo cp nginx-datapulseai.conf /etc/nginx/sites-available/datapulseai
# sudo ln -s /etc/nginx/sites-available/datapulseai /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name datapulseai.co www.datapulseai.co;

    # Allow Let's Encrypt verification (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Main Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datapulseai.co www.datapulseai.co;

    # SSL certificates (managed by acme.sh, tls-alpn-01 over port 443)
    # Port 80 is blocked inbound by the ISP, so HTTP-01 validation cannot be used.
    # Renewal runs unattended via the acme-sh.timer systemd unit.
    ssl_certificate /etc/nginx/ssl/datapulseai.crt;
    ssl_certificate_key /etc/nginx/ssl/datapulseai.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' https:;
        frame-ancestors 'self';
        base-uri 'self';
        form-action 'self';
    " always;

    # Logs
    access_log /var/log/nginx/datapulseai-access.log;
    error_log /var/log/nginx/datapulseai-error.log;

    # Root directory for static React build
    root /srv/http/datapulseai/client/dist;
    index index.html;

    # Maintenance mode
    # ON:  touch /srv/http/datapulseai/maintenance.flag
    # OFF: rm    /srv/http/datapulseai/maintenance.flag
    # The flag is checked per request, so toggling needs no nginx reload.
    # This runs in the server rewrite phase, ahead of location matching, so it
    # covers the SPA, /assets/, the favicon blocks and /api/ in one place.
    set $maintenance 0;
    if (-f /srv/http/datapulseai/maintenance.flag) {
        set $maintenance 1;
    }
    if ($maintenance = 1) {
        return 503;
    }

    error_page 503 =503 @maintenance;

    location @maintenance {
        root /srv/http/datapulseai/client/dist;
        try_files /maintenance.html =503;

        # Retry-After marks the outage as temporary for crawlers (48h, to the 16th).
        add_header Retry-After 172800 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        # Re-declared: a location with its own add_header does not inherit
        # the server-level security headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/vnd.ms-fontobject
        font/opentype;

    # Client body size limit (for file uploads via contact form)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # API Backend - Proxy to Express server on port 5000
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;

        # Headers for proxying
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Disable caching for API
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_buffering off;

        # API specific timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # React app static assets with long cache
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon and manifest files
    location ~* \.(ico|png|webmanifest|xml|txt)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Main React app - SPA routing
    location / {
        # Try to serve the file, otherwise serve index.html (for React Router)
        try_files $uri $uri/ /index.html;

        # Cache control for HTML
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Health check endpoint (served by backend)
    location = /api/health {
        proxy_pass http://localhost:5000/api/health;
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup and source files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
